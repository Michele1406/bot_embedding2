# Guida tecnica ai prodotti (carne, legumi e cereali, riso, farine, pomodoro, uova, formaggi da cucina).
# Conoscenza culinaria GENERALE e prudente, scritta una volta qui (mai nel prompt): entra nel contesto solo per i
# prodotti realmente a catalogo (core/guide_prodotto.py). Dati della scheda (linea Oberto, tempi di cottura) hanno la
# precedenza e si leggono dal testo del prodotto. Porzioni = indicazioni di massima per un secondo/primo, non regole.
#
# Campi:  quando: selettore (come abbinamenti_horeca.yaml: parole/sottocategorie/reparti/escludi)
#         e_anche: [[parole], [parole]]  ogni gruppo deve comparire (AND di OR)
#         modifica: true = nota che si aggiunge alla guida base (es. "gia' cotti")
#         usi: chiavi d'uso (vedi sezione usi) per "che taglio per la griglia?"
#         simili: id di guide con cui il prodotto e' intercambiabile (sostituzione tra tagli)
# L'ordine conta: vince la prima guida base che combacia (prima le piu' specifiche).

usi:
  griglia: ["griglia", "grigliat", "brace", "barbecue", "bbq", "piastra", "fry-top"]
  tagliata: ["tagliata", "tagliate"]
  padella: ["padella", "scaloppin", "bistecc"]
  forno: ["arrosto", "arrost", "al forno", "roast beef"]
  brasato: ["brasat", "stracott", "cottura lunga", "cottura lenta", "in umido"]
  bollito: ["bollit", "lesso", "lessat", "lessare"]
  ragu: ["ragu", "ragù", "sugo di carne"]
  crudo: ["tartare", "carne cruda", "battuta", "crudo", "carpaccio"]
  hamburger: ["hamburger", "burger", "panino", "panini"]
  spezzatino: ["spezzatino"]
  zuppa: ["zuppa", "zuppe", "minestra", "minestrone", "vellutata"]
  insalata: ["insalata", "insalate", "insalatona"]
  risotto: ["risotto", "risotti"]
  pizza: ["pizza", "pinsa"]
  pane: ["pane", "panificazione", "focaccia"]
  pasta_fresca: ["pasta fresca", "pasta all'uovo", "tagliatelle fatte", "sfoglia"]
  dolci: ["dolci", "pasticceria", "torta", "torte", "lievitati"]
  sugo: ["sugo", "sughi", "salsa di pomodoro", "pummarola"]
  polenta: ["polenta"]
  pesce: ["pesce", "crostacei", "frutti di mare"]
  frittura: ["frittur", "friggere", "fritto", "fritti"]
  antipasto: ["antipast", "crostin", "aperitiv", "tartine"]
  primo: ["primo", "primi", "spaghetti", "linguine", "condire la pasta", "per la pasta"]
  finitura: ["finitura", "a crudo", "a gocce", "decorare", "guarnire"]

# ---------------------------------------------------------------- CARNE
guide:
  - id: tomahawk
    famiglia: carne
    nome: Tomahawk
    quando: {parole: ["tomahawk"]}
    carattere: "costata alta con l'osso lungo lasciato intero: scenografica, si porta a tavola intera e si affetta"
    cotture: ["griglia o brace", "scottatura e finitura in forno"]
    piatti: ["tomahawk alla griglia", "tagliata di tomahawk"]
    porzione: "circa 500 g a persona (con osso); un pezzo da 1 kg per due"
    usi: [griglia, forno]
    simili: [fiorentina, cowboy, costata]
  - id: fiorentina
    famiglia: carne
    nome: Fiorentina
    quando: {parole: ["fiorentina"]}
    carattere: "taglio alto con l'osso a T (lombata e filetto), da cuocere al sangue"
    cotture: ["griglia o brace"]
    piatti: ["bistecca alla fiorentina"]
    porzione: "circa 500 g a persona (con osso); 1 kg per due"
    usi: [griglia]
    simili: [tomahawk, cowboy, costata]
  - id: cowboy
    famiglia: carne
    nome: Cowboy steak
    quando: {parole: ["cowboy"]}
    carattere: "costata alta con osso corto: carne succosa e marezzata, di grande effetto nel piatto"
    cotture: ["griglia o brace", "padella e forno"]
    piatti: ["cowboy steak alla griglia"]
    porzione: "circa 400-500 g a persona (con osso)"
    usi: [griglia, forno]
    simili: [tomahawk, fiorentina, costata]
  - id: costata
    famiglia: carne
    nome: Costata
    quando: {parole: ["costata"], escludi: ["tomahawk", "fiorentina", "cowboy"]}
    carattere: "taglio con l'osso dalla lombata: sapore pieno, buona marezzatura"
    cotture: ["griglia", "piastra", "padella e finitura in forno"]
    piatti: ["costata alla griglia", "costata con sale grosso e rosmarino"]
    porzione: "circa 350-500 g a persona (con osso)"
    usi: [griglia, padella]
    simili: [fiorentina, tomahawk, rib_eye]
  - id: rib_eye
    famiglia: carne
    nome: Rib eye / cube roll
    quando: {parole: ["rib eye", "ribeye", "cube roll"]}
    carattere: "parte alta della lombata senza osso: tenera e marezzata (il cube roll e' il pezzo intero da porzionare)"
    cotture: ["griglia", "piastra", "padella", "forno (pezzo intero)"]
    piatti: ["rib eye alla piastra", "tagliata di rib eye", "arrosto di cube roll"]
    porzione: "circa 200-250 g a persona"
    usi: [griglia, padella, forno, tagliata]
    simili: [controfiletto, costata]
  - id: filetto
    famiglia: carne
    nome: Filetto
    quando: {parole: ["filetto con cordone", "filetto c/c", "sottofiletto"]}
    carattere: "il taglio piu' tenero e magro, poco grasso: cotture rapide e condimenti delicati"
    cotture: ["padella", "griglia", "forno (pezzo intero)"]
    piatti: ["filetto al pepe verde", "tournedos", "filetto in crosta", "carpaccio"]
    porzione: "circa 150-200 g a persona"
    usi: [padella, griglia, crudo]
    simili: [controfiletto, rib_eye]
  - id: controfiletto
    famiglia: carne
    nome: Controfiletto
    quando: {parole: ["controfiletto"]}
    carattere: "parte magra e saporita della lombata, senza osso"
    cotture: ["griglia", "piastra", "padella", "forno (pezzo intero)"]
    piatti: ["tagliata", "roast beef", "bistecche"]
    porzione: "circa 180-220 g a persona"
    usi: [griglia, padella, tagliata, forno]
    simili: [rib_eye, filetto]
  - id: lombata
    famiglia: carne
    nome: Lombata intera
    quando: {parole: ["lombata"]}
    carattere: "pezzo intero con osso (e filetto) da sezionare in costate, fiorentine e bistecche"
    cotture: ["si porziona e si cuoce alla griglia o in padella"]
    piatti: ["costate", "fiorentine", "bistecche"]
    porzione: "dipende dal taglio che si ricava (350-500 g a persona con osso)"
    usi: [griglia]
    simili: [costata, fiorentina]
  - id: tagliata
    famiglia: carne
    nome: Tagliata
    quando: {parole: ["tagliata"]}
    carattere: "fette di coscia pronte per cottura rapida: si cuoce, si lascia riposare e si affetta"
    cotture: ["griglia", "piastra", "padella"]
    piatti: ["tagliata con rucola e grana", "tagliata al rosmarino"]
    porzione: "circa 180-220 g a persona"
    usi: [tagliata, griglia, padella]
    simili: [magri_coscia, controfiletto]
  - id: carpaccio
    famiglia: carne
    nome: Carpaccio
    quando: {parole: ["carpaccio"], escludi: ["marinato", "affumicato"]}
    carattere: "pezzo magro di coscia da affettare finissimo e servire crudo"
    cotture: ["nessuna: si serve crudo, condito al momento"]
    piatti: ["carpaccio con rucola e grana", "carpaccio con olio, limone e sale"]
    porzione: "circa 80-100 g a persona"
    usi: [crudo]
    simili: [da_battere]
  - id: da_battere
    famiglia: carne
    nome: Carne da battere / tartare
    quando: {parole: ["da battere", "battere", "gran cruda", "tartare", "tartara", "crudo d'alba", "cruda di anteriore"]}
    carattere: "carne da servire cruda, battuta al coltello e condita al momento (olio, sale, limone)"
    cotture: ["nessuna: si serve cruda"]
    piatti: ["battuta al coltello", "tartare"]
    porzione: "circa 120-150 g a persona"
    usi: [crudo]
    simili: [carpaccio]
  - id: roast_beef_cotto
    famiglia: carne
    nome: Cotti da affettare
    quando: {parole: ["roast beef cotto", "girello cotto", "vitel"]}
    carattere: "gia' cotto: si affetta sottile e si serve freddo"
    cotture: ["nessuna: pronto da affettare"]
    piatti: ["roast beef freddo", "vitello tonnato"]
    porzione: "circa 100-150 g a persona"
    usi: [forno, insalata]
  - id: roast_beef
    famiglia: carne
    nome: Fesone per roast beef
    quando: {parole: ["roast beef", "fesone"]}
    carattere: "pezzo magro da cuocere intero e affettare sottile"
    cotture: ["forno (pezzo intero, rosato al centro)"]
    piatti: ["roast beef", "roast beef con salse"]
    porzione: "circa 150-200 g a persona"
    usi: [forno]
    simili: [magri_coscia]
  - id: picanha
    famiglia: carne
    nome: Picanha
    quando: {parole: ["picanha"]}
    carattere: "taglio con copertura di grasso che lo mantiene succoso: si cuoce intero e si affetta"
    cotture: ["griglia o brace", "forno"]
    piatti: ["picanha alla brace", "spiedo di picanha"]
    porzione: "circa 200-250 g a persona"
    usi: [griglia, forno]
    simili: [magri_coscia]
  - id: fibra_lunga
    famiglia: carne
    nome: Bavetta, tasca e diaframma
    quando: {parole: ["bavetta", "tasca per griglia", "diaframma"]}
    carattere: "tagli a fibra lunga e sapore intenso: cottura rapida e si affettano contro fibra"
    cotture: ["griglia", "padella molto calda"]
    piatti: ["tagliata di bavetta", "straccetti"]
    porzione: "circa 180-220 g a persona"
    usi: [griglia, padella, tagliata]
    simili: [tagliata]
  - id: griglia_anteriore
    famiglia: carne
    nome: Tagli da griglia dell'anteriore
    quando: {parole: ["flatiron", "shoulder", "chuck steak", "sottopaletta"]}
    carattere: "dalla spalla: sapore deciso, buon rapporto qualita'-prezzo per la griglia"
    cotture: ["griglia", "piastra", "padella"]
    piatti: ["bistecca alla griglia", "tagliata"]
    porzione: "circa 200-250 g a persona"
    usi: [griglia, padella, tagliata]
    simili: [costata, tagliata]
  - id: ossobuco
    famiglia: carne
    nome: Stinco
    quando: {parole: ["stinco", "ossobuco"]}
    carattere: "taglio con osso e midollo, ricco di tessuto connettivo: richiede cottura lunga"
    cotture: ["in umido", "brasato", "lessato"]
    piatti: ["ossobuco", "stinco brasato"]
    porzione: "circa 300-400 g a persona (con osso)"
    usi: [brasato, bollito]
    simili: [brasato_lungo]
  - id: brasato_lungo
    famiglia: carne
    nome: Tagli da cottura lunga
    quando: {parole: ["guancia", "guanciale di", "coda", "muscolo", "reale", "chuck", "noce di spalla", "spezzatino"], escludi: ["trita", "hamburger"]}
    carattere: "tagli saporiti e ricchi di tessuto connettivo: con cottura lenta diventano morbidi"
    cotture: ["brasato", "stracotto", "in umido", "ragu' di carne"]
    piatti: ["brasato", "guancia al vino rosso", "spezzatino", "ragu'"]
    porzione: "circa 200-250 g a persona (senza osso)"
    usi: [brasato, spezzatino, ragu, bollito]
    simili: [bollito]
  - id: bollito
    famiglia: carne
    nome: Tagli da bollito
    quando: {parole: ["lesso", "biancostato", "brutto e buono", "punta", "pancia", "lingua", "testa", "ribs"], escludi: ["suino", "maiale"]}
    carattere: "tagli adatti alla cottura lenta in acqua o in forno basso: il brodo e la carne rendono insieme"
    cotture: ["lessato", "brasato", "forno a bassa temperatura"]
    piatti: ["bollito misto", "lingua in salsa verde", "biancostato brasato"]
    porzione: "circa 200-250 g a persona (con osso fino a 300)"
    usi: [bollito, brasato]
    simili: [brasato_lungo]
  - id: trippa
    famiglia: carne
    nome: Trippa
    quando: {parole: ["trippa"]}
    carattere: "frattaglia da cuocere a lungo, tipica della cucina di tradizione"
    cotture: ["in umido"]
    piatti: ["trippa in umido"]
    porzione: "circa 200 g a persona"
    usi: [brasato]
  - id: magri_coscia
    famiglia: carne
    nome: Tagli magri della coscia
    quando: {parole: ["noce", "girello", "magatello", "fesa", "sottofesa", "scamone", "spinacino", "codone", "gallinella", "bavetta", "fettine"]}
    carattere: "tagli magri e teneri: ottimi in fettine, tagliata, arrosto affettato sottile e carpaccio"
    cotture: ["padella veloce", "piastra", "forno (arrosto)"]
    piatti: ["scaloppine", "tagliata", "arrosto", "vitello tonnato (girello)", "carpaccio"]
    porzione: "circa 150-200 g a persona"
    usi: [padella, tagliata, forno, crudo]
    simili: [tagliata, controfiletto]
  - id: bistecca
    famiglia: carne
    nome: Bistecca
    quando: {parole: ["bistecca", "bistecche"]}
    carattere: "fetta singola con osso, pronta per una cottura rapida"
    cotture: ["griglia", "piastra", "padella"]
    piatti: ["bistecca alla griglia", "bistecca al rosmarino"]
    porzione: "circa 250-350 g a persona (con osso)"
    usi: [griglia, padella]
    simili: [costata, magri_coscia]
  - id: lombetto
    famiglia: carne
    nome: Lombetto
    quando: {parole: ["lombetto"]}
    carattere: "taglio del posteriore dalla linea tagli speciali per griglia: cottura veloce a fuoco alto"
    cotture: ["griglia", "fry-top"]
    piatti: ["tagliata", "bistecche di lombetto"]
    porzione: "circa 150-200 g a persona"
    usi: [griglia, padella, tagliata]
    simili: [controfiletto, tagliata]
  - id: sfilaccio
    famiglia: carne
    nome: Sfilaccio affumicato
    quando: {parole: ["sfilaccio"]}
    carattere: "gia' pronto al consumo, affumicato, dal gusto intenso"
    cotture: ["nessuna: pronto al consumo"]
    piatti: ["antipasto", "guarnizione per insalate", "tagliere"]
    usi: [insalata]
  - id: bockwurst
    famiglia: carne
    nome: Bockwurst
    quando: {parole: ["bockwurst"]}
    carattere: "salsiccia di carne gia' cotta al vapore, leggermente affumicata, in budello naturale"
    cotture: ["da scaldare prima di servire"]
    piatti: ["piatto con contorni", "panino"]
    usi: [hamburger]
  - id: macinato
    famiglia: carne
    nome: Macinato / trita
    quando: {parole: ["trita", "trito", "macinat"]}
    carattere: "carne macinata di coscia: base per ragu', polpette, ripieni e hamburger fatti in casa"
    cotture: ["padella", "forno", "griglia (come hamburger)"]
    piatti: ["ragu'", "polpette", "ripieni", "hamburger"]
    porzione: "circa 80-100 g a persona per il ragu'; 150-180 g per un hamburger"
    usi: [ragu, hamburger]
    simili: [hamburger]
  - id: hamburger
    famiglia: carne
    nome: Hamburger
    quando: {parole: ["hamburger", "hamburgherone", "burger", "polpa imperiale"]}
    carattere: "gia' formato in monoporzione: pronto per piastra o griglia"
    cotture: ["piastra", "griglia", "padella"]
    piatti: ["hamburger nel panino", "hamburger con formaggio e salse"]
    porzione: "1 pezzo (150-200 g) a persona"
    usi: [hamburger, griglia]
    simili: [macinato]
  - id: salsiccia
    famiglia: carne
    nome: Salsiccia e impasti
    quando: {parole: ["salsiccia", "impasto salsiccia", "polpett"]}
    carattere: "preparazione di carne cruda: si cuoce prima di servire"
    cotture: ["griglia", "padella", "ragu'"]
    piatti: ["salsiccia alla griglia", "ragu' di salsiccia", "polpette"]
    porzione: "circa 150-200 g a persona"
    usi: [griglia, ragu]
  - id: agnello
    famiglia: carne
    nome: Agnello
    quando: {parole: ["agnello"]}
    carattere: "mezzena da sezionare in cosciotto, spalla e carre' (costolette)"
    cotture: ["forno (cosciotto e spalla)", "griglia o padella (costolette)"]
    piatti: ["cosciotto di agnello al forno", "costolette di agnello"]
    porzione: "circa 250-300 g a persona (con osso)"
    usi: [forno, griglia]
  - id: suino_fresco
    famiglia: carne
    nome: Pancia di suino
    quando: {parole: ["pancia"], e_anche: [["suino", "maiale"]]}
    carattere: "taglio grasso e saporito, adatto a cotture lente"
    cotture: ["forno a bassa temperatura", "brasato"]
    piatti: ["pancia al forno", "pancia brasata"]
    porzione: "circa 150-200 g a persona"
    usi: [forno, brasato]
  - id: pollo
    famiglia: carne
    nome: Pollo
    quando: {parole: ["pollo"]}
    carattere: "intero eviscerato: da arrostire, lessare o sezionare"
    cotture: ["forno (arrosto)", "lessato", "in umido (a pezzi)"]
    piatti: ["pollo arrosto", "pollo in umido"]
    porzione: "circa 300 g a persona (con osso)"
    usi: [forno, bollito]
  - id: oca
    famiglia: carne
    nome: Speck d'oca
    quando: {parole: ["speck d'oca", "petto d'oca"]}
    carattere: "petto d'oca affumicato: da affettare e servire freddo"
    cotture: ["nessuna: si serve a fette"]
    piatti: ["antipasto", "insalate", "tagliere"]
    porzione: "circa 50-80 g a persona come antipasto"

  # ------------------------------------------------------------ UOVA
  - id: uova
    famiglia: uova
    nome: Uova
    quando: {parole: ["uova"], reparti: [CARNE]}
    carattere: "uova fresche categoria A, da cucina e pasticceria"
    cotture: ["al tegamino", "sode", "in camicia", "in impasti e creme"]
    piatti: ["carbonara", "pasta fresca all'uovo", "creme e dolci", "frittate"]
    porzione: "1-2 uova a persona; per la pasta fresca circa 1 uovo ogni 100 g di farina"
    usi: [pasta_fresca, dolci]

  # ------------------------------------------------------------ LEGUMI E CEREALI (modifica: nota che si somma alla base)
  - id: pronti
    famiglia: legume
    modifica: true
    nome: Gia' cotti
    quando: {parole: ["cotti", "cotta", "cotte", "al naturale"], sottocategorie: ["VEGETALI SECCHI", "ALTRI LEGUMI/VEGETALI/CEREALI", "FAGIOLI CONSERVATI"], tutte: true}
    e_anche: [["ceci", "lenticchie", "fagioli", "zuppa", "minestra", "cicerchia", "fave"]]
    nota: "gia' cotti: niente ammollo ne' cottura, si scolano e si scaldano o si condiscono; fanno risparmiare tempo in cucina"
  - id: ceci
    famiglia: legume
    nome: Ceci
    quando: {parole: ["ceci"], sottocategorie: ["VEGETALI SECCHI", "ALTRI LEGUMI/VEGETALI/CEREALI", "FAGIOLI CONSERVATI"], tutte: true}
    carattere: "legume versatile, dal sapore delicato: tiene bene la cottura"
    ammollo: "si (circa 12 ore); i decorticati no"
    piatti: ["pasta e ceci", "zuppa di ceci", "hummus", "insalata di ceci", "ceci e gamberi"]
    porzione: "circa 70-80 g da secchi a persona per un primo o piatto unico; 40-50 g come contorno; resa circa il doppio del peso a secco"
    usi: [zuppa, insalata]
  - id: lenticchie
    famiglia: legume
    nome: Lenticchie
    quando: {parole: ["lenticchie"], sottocategorie: ["VEGETALI SECCHI", "ALTRI LEGUMI/VEGETALI/CEREALI"], tutte: true}
    carattere: "legume a cottura rapida; le rosse decorticate si sfaldano e fanno cremose le zuppe"
    ammollo: "non necessario"
    piatti: ["zuppa di lenticchie", "lenticchie in umido", "insalata di lenticchie", "vellutata di lenticchie rosse"]
    porzione: "circa 70-80 g da secchi a persona per un primo; 40-50 g come contorno"
    usi: [zuppa, insalata]
  - id: fagioli
    famiglia: legume
    nome: Fagioli
    quando: {parole: ["fagioli"], sottocategorie: ["VEGETALI SECCHI", "ALTRI LEGUMI/VEGETALI/CEREALI", "FAGIOLI CONSERVATI"], tutte: true}
    carattere: "cannellini, borlotti e tondini: legumi cremosi che si prestano a zuppe, contorni e insalate"
    ammollo: "si (circa 12 ore)"
    piatti: ["pasta e fagioli", "zuppa di fagioli", "fagioli all'uccelletto", "insalata di fagioli"]
    porzione: "circa 70-80 g da secchi a persona per un primo; 40-50 g come contorno"
    usi: [zuppa, insalata]
  - id: fave
    famiglia: legume
    nome: Fave e piselli decorticati
    quando: {parole: ["fave", "piselli"], sottocategorie: ["VEGETALI SECCHI"], tutte: true}
    carattere: "legumi spezzati o decorticati: si sfaldano in cottura e danno creme e passati"
    ammollo: "di solito non serve (decorticati)"
    piatti: ["pure' di fave", "vellutata di piselli", "zuppa"]
    porzione: "circa 70-80 g da secchi a persona"
    usi: [zuppa]
  - id: cicerchia
    famiglia: legume
    nome: Cicerchia e roveja
    quando: {parole: ["cicerchia", "roveja"], sottocategorie: ["VEGETALI SECCHI"], tutte: true}
    carattere: "legumi antichi del centro Italia, dal gusto rustico"
    piatti: ["zuppa", "minestra rustica"]
    porzione: "circa 70-80 g da secchi a persona"
    usi: [zuppa]
  - id: zuppe
