# ==============================================================================
# RICETTARIO - correzioni e nuove ricette (applicate da scripts/aggiorna_ricettario.py)
# ==============================================================================
# Il ricettario base e' Ricettario_SO_FOOD.xlsx (296 ricette) + 112 ricette presenti
# solo nel database (non nel file Excel): il builder le esporta in
# data/ricettario_db_only.json cosi' diventano versionabili. Questo file aggiunge
# SOPRA a entrambi: non modifica ne' l'Excel ne' la collezione `ricette_sofood`,
# crea la collezione `ricette_v2`.
#
# Regole di scrittura degli ingredienti: usare nomi generici che l'ontologia
# (core/ontologia_horeca.yaml) sa risolvere in una famiglia di prodotti
# ("olive da tavola", "taralli o grissini", "anacardi o nocciole", "patatine",
# "finger food caldo"). Per le olive: SOLO in salamoia (regola del cliente).
# ==============================================================================

patch:
  TRIS_BAR_01:
    tag_dieta: "vegano, vegetariano"
    note_composizione: >
      Servire in tre ciotoline separate: una per i prodotti da forno secchi (taralli o grissini),
      una per le olive da tavola in salamoia (tipo baresane, Cerignola) e una per la frutta secca
      (anacardi, nocciole, arachidi).
    stato_verifica_catalogo: verificata
  TRIS_BAR_02:
    ingredienti_sostituisci:
      "frittelline calde": "finger food caldo"
      "olive condite": "olive da tavola"
    note_composizione: >
      Finger food caldi fritti o rigenerati espressi serviti con birra, con taralli o grissini e
      olive da tavola in salamoia in ciotolina.
    stato_verifica_catalogo: verificata
  APERITIVO_TRIS_CLASSICO:
    canali_adatti: "wine bar, ristorante, enoteca"
    canali_sconsigliati: "pub"

